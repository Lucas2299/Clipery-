<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in - Clipery</title>
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .auth-wrap {
        min-height: calc(100vh - 90px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2.5rem 1.1rem 4rem;
      }
      .auth-card {
        width: 100%;
        max-width: 430px;
        background: rgba(14, 14, 20, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 20px;
        padding: 2rem 1.8rem 1.9rem;
        box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
      }
      .auth-card h1 { font-size: 1.55rem; margin: 0 0 0.35rem; }
      .auth-sub { color: #9894a6; font-size: 0.92rem; margin: 0 0 1.4rem; }
      .auth-tabs { display: flex; gap: 0.5rem; margin: 0 0 1.35rem; }
      .auth-tab {
        flex: 1; padding: 0.6rem 0.5rem; border-radius: 999px; cursor: pointer;
        font-family: inherit; font-weight: 700; font-size: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.16); background: transparent; color: #f4f1ea;
        transition: all 0.15s;
      }
      .auth-tab.on {
        background: linear-gradient(135deg, #ff4d6d, #ff8a4c);
        border-color: transparent; color: #fff;
        box-shadow: 0 8px 22px rgba(255, 77, 109, 0.32);
      }
      .auth-field { margin: 0 0 0.95rem; }
      .auth-field label {
        display: block; font-size: 0.82rem; font-weight: 700;
        color: #c9c5d8; margin: 0 0 0.35rem;
      }
      .auth-field input {
        width: 100%; padding: 0.78rem 0.9rem; border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(0, 0, 0, 0.4);
        color: #f4f1ea; font-family: inherit; font-size: 0.95rem;
      }
      .auth-field input:focus { outline: none; border-color: #ff4d6d; }
      .auth-hint { font-size: 0.76rem; color: #66627a; margin: 0.35rem 0 0; }
      .auth-submit { width: 100%; margin-top: 0.4rem; justify-content: center; }
      .auth-msg {
        display: none; margin: 0 0 1rem; padding: 0.7rem 0.85rem; border-radius: 12px;
        font-size: 0.87rem; line-height: 1.45;
      }
      .auth-msg.err { display: block; background: rgba(255, 77, 109, 0.12); border: 1px solid rgba(255, 77, 109, 0.4); color: #ffb3c1; }
      .auth-msg.ok { display: block; background: rgba(200, 245, 66, 0.1); border: 1px solid rgba(200, 245, 66, 0.35); color: #dcf98d; }
      .auth-foot { margin: 1.15rem 0 0; text-align: center; font-size: 0.86rem; color: #9894a6; }
      .auth-foot a { color: #ff8a4c; text-decoration: none; font-weight: 700; }
      .social { display: none; margin: 0 0 1.25rem; }
      .social.on { display: block; }
      .social-btn {
        width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
        padding: 0.75rem 1rem; margin: 0 0 0.6rem; border-radius: 12px; cursor: pointer;
        font-family: inherit; font-size: 0.93rem; font-weight: 700; text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.16); transition: all 0.15s;
      }
      .social-btn:hover { transform: translateY(-1px); }
      .social-google { background: #fff; color: #1f1f1f; border-color: #fff; }
      .social-apple { background: #000; color: #fff; border-color: rgba(255, 255, 255, 0.35); }
      .social-btn svg { width: 18px; height: 18px; flex: none; }
      .or-line {
        display: flex; align-items: center; gap: 0.75rem;
        margin: 0 0 1.15rem; color: #66627a; font-size: 0.76rem;
        text-transform: uppercase; letter-spacing: 0.08em;
      }
      .or-line::before, .or-line::after {
        content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1);
      }
      .auth-note {
        margin: 1.3rem 0 0; padding-top: 1.1rem; border-top: 1px solid rgba(255, 255, 255, 0.07);
        font-size: 0.78rem; color: #66627a; text-align: center;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <a class="logo" href="/"><img class="logo-img" src="/logo.png" alt="Clipery" /></a>
        <nav class="nav" aria-label="Primary">
          <a href="/pricing" data-nav>Pricing</a>
          <a href="/waitlist" data-nav>Waitlist</a>
        </nav>
      </div>
    </header>

    <main class="auth-wrap">
      <div class="auth-card">
        <div class="auth-tabs">
          <button type="button" class="auth-tab on" id="tab-login">Log in</button>
          <button type="button" class="auth-tab" id="tab-register">Create account</button>
        </div>

        <h1 id="auth-title">Welcome back</h1>
        <p class="auth-sub" id="auth-sub">Log in to open the Studio and your clip library.</p>

        <div class="auth-msg" id="auth-msg" role="alert"></div>

        <div class="social" id="social">
          <a class="social-btn social-google" id="btn-google" href="/api/auth/google">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.6 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.1 5.4-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.4z"/>
              <path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C1 16.4 0 20.1 0 24s1 7.6 2.6 10.8l7.8-6.1z"/>
              <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.6 2.1-8.8 2.1-6.4 0-11.7-3.7-13.6-8.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/>
            </svg>
            Continue with Google
          </a>
          <a class="social-btn social-apple" id="btn-apple" href="/api/auth/apple">
            <svg viewBox="0 0 384 512" aria-hidden="true" fill="currentColor">
              <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            Continue with Apple
          </a>
          <div class="or-line">or</div>
        </div>

        <form id="auth-form" novalidate>
          <div class="auth-field" id="field-name" hidden>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name" />
          </div>

          <div class="auth-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required />
            <p class="auth-hint" id="pw-hint" hidden>At least 8 characters.</p>
          </div>

          <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Log in</button>
        </form>

        <p class="auth-foot" id="auth-foot">
          No account yet? <a href="#" id="switch-link">Create one free</a>
        </p>

        <p class="auth-note">Studio, Rank video and Library are for members only.</p>
      </div>
    </main>

    <script src="/shared.js"></script>
    <script src="/auth.js"></script>
  </body>
</html>
