<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library · Clipery</title>
    <meta name="description" content="All your Clipery jobs and ranked clips." />
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>

    <header class="header">
      <div class="header-inner">
        <a class="logo" href="/"><img class="logo-img" src="/logo.png" alt="Clipery" /></a>
        <nav class="nav" aria-label="Primary">
          <a class="btn btn-primary btn-sm" href="/studio" data-nav>Studio</a>
          <a href="/library" data-nav>Library</a>
          <a href="/pricing" data-nav class="nav-hide-sm">Pricing</a>
        </nav>
      </div>
    </header>

    <main class="page container">
      <div class="page-hero" style="display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; align-items: flex-end">
        <div>
          <div class="eyebrow">Library</div>
          <h1>Your clip jobs</h1>
          <p>Every studio run is saved here. Open a job to replay clips, see rankings, and download MP4s.</p>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-refresh">Refresh</button>
      </div>

      <div id="job-list" class="job-list">
        <div class="empty">Loading…</div>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <a class="footer-brand" href="/">Clipery</a>
        <div class="footer-links">
          <a href="/studio">Studio</a>
          <a href="/rank">Rank</a>
          <a href="/library">Library</a>
          <a href="/waitlist">Waitlist</a>
        </div>
        <div>© <span id="year"></span></div>
      </div>
    </footer>

    <script src="/shared.js?v=2"></script>
    <script src="/library.js"></script>
  </body>
</html>
