<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job · Clipery</title>
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow bg-glow-1" aria-hidden="true"></div>

    <header class="header">
      <div class="header-inner">
        <a class="logo" href="/"><img class="logo-img" src="/logo.png" alt="Clipery" /></a>
        <nav class="nav" aria-label="Primary">
          <a class="btn btn-primary btn-sm" href="/studio" data-nav>Studio</a>
          <a href="/library" data-nav>Library</a>
          <a href="/pricing" data-nav class="nav-hide-sm">Pricing</a>
        </nav>
      </div>
    </header>

    <main class="page container">
      <div class="page-hero">
        <div class="eyebrow">Job detail</div>
        <h1 id="job-title">Loading…</h1>
        <p id="job-meta" class="muted"></p>
      </div>

      <div id="status-box" class="status-box hide">
        <div class="status-top">
          <div>
            <strong id="status-stage">…</strong>
          </div>
          <span class="status-pct" id="status-pct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <p class="muted" id="status-detail"></p>
      </div>

      <p class="form-msg error" id="job-error"></p>

      <div id="comp-host" style="margin-bottom: 1.5rem"></div>
      <div id="clips-host"></div>
      <div id="table-host" style="margin-top: 1.5rem"></div>
      <div id="errors-host" style="margin-top: 1rem"></div>

      <div class="inline-actions" style="margin-top: 2rem; justify-content: flex-start">
        <a class="btn btn-ghost" href="/library">← Back to library</a>
        <a class="btn btn-primary" href="/studio">Run another</a>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <a class="footer-brand" href="/">Clipery</a>
        <div>© <span id="year"></span></div>
      </div>
    </footer>

    <script src="/shared.js?v=2"></script>
    <script src="/job.js"></script>
  </body>
</html>
